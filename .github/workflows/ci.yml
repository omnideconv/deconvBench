# Tests of the pipeline on the small CI data in data/ci (see pipeline/tests/ci/).
# static     lint, every run config with every profile, dry run of all workflows (no containers)
# workflows  all eight workflows with MuSiC, without and with the reference split, checks, unit tests
# methods    the main workflow with every method in its own image; only when method code changed,
#            for pull requests from forks and when started by hand
# A pull request from a branch of this repository is tested by the push run of the branch; its own
# run skips all jobs, so that the same commit is not tested twice.
name: CI

on:
  push:
    paths: ['pipeline/**', 'data/ci/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
    paths: ['pipeline/**', 'data/ci/**', '.github/workflows/ci.yml']
  workflow_dispatch:

# a newer push to the same branch cancels the run of the older one
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  NXF_VER: 25.10.2
  NXF_ANSI_LOG: false
  # images: ghcr.io/omnideconv/deconvbench-images (standard, autogenes, rectangle) and the private
  # ghcr.io/omnideconv/deconvbench-images-secret (SECRET, whose repository states no licence)
  REGISTRY: oras://ghcr.io/omnideconv

jobs:
  static:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      methods: ${{ steps.changes.outputs.methods }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        name: Did method code change?
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "methods=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then echo "methods=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^(pipeline/(bin/|modules/|optimal_normalizations.csv|sc_datasets_technologies.csv|tests/ci/)|data/ci/|\.github/workflows/ci.yml)'; then
            echo "methods=true" >> "$GITHUB_OUTPUT"
          else
            echo "methods=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - name: Install Nextflow
        run: curl -fsSL https://get.nextflow.io | bash && sudo mv nextflow /usr/local/bin/
      - name: Lint
        run: cd pipeline && nextflow lint main.nf functions.nf modules/local/*.nf
      - name: Every run config with every profile
        run: |
          cd pipeline
          for c in configs/*.config; do for p in apptainer autogenes rectangle secret cibersortx; do
            nextflow -q -C "$c" config . -profile "$p" > /dev/null || { echo "::error::$c, profile $p"; exit 1; }
          done; done
      - name: Dry run of all workflows
        run: |
          export CI_INPUT=$RUNNER_TEMP/input CI_OUT=$RUNNER_TEMP/out IMG_STANDARD=none
          cp -r data/ci "$CI_INPUT"
          for wf in main simulation subsampling impact_missing_cell_types simulation_spillover simulation_unknown_content simulation_resolution_analysis simulation_impact_technology; do
            entry=(); [ "$wf" != main ] && entry=(-entry "$wf")
            nextflow -q -C pipeline/tests/ci/ci.config run pipeline/main.nf "${entry[@]}" -preview -work-dir "$RUNNER_TEMP/work" || { echo "::error::preview of $wf"; exit 1; }
          done

  workflows:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - name: Install Nextflow
        run: curl -fsSL https://get.nextflow.io | bash && sudo mv nextflow /usr/local/bin/
      - name: Install Apptainer
        run: |
          curl -fsSLO https://github.com/apptainer/apptainer/releases/download/v1.3.6/apptainer_1.3.6_amd64.deb
          sudo apt-get install -y ./apptainer_1.3.6_amd64.deb
          # Ubuntu 24.04 restricts the user namespaces that apptainer uses without root
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Pull the standard image
        # private packages: the repository needs read access to them (package settings, "Manage Actions access")
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login --username "${{ github.actor }}" --password-stdin oras://ghcr.io
          apptainer pull "$RUNNER_TEMP/standard.sif" "$REGISTRY/deconvbench-images:standard-2.0"
      - name: Run all workflows and check them
        run: |
          export IMG_STANDARD=$RUNNER_TEMP/standard.sif
          export CI_BIND=$GITHUB_WORKSPACE,$RUNNER_TEMP
          pipeline/tests/ci/run_ci.sh workflows "$RUNNER_TEMP/ci"
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: workflows-logs
          path: ${{ runner.temp }}/ci/*/nextflow.log
          retention-days: 7

  methods:
    needs: static
    if: needs.static.outputs.methods == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: standard,  image: 'deconvbench-images:standard-2.0',  var: IMG_STANDARD }
          - { suite: autogenes, image: 'deconvbench-images:autogenes-1.3', var: IMG_AUTOGENES }
          - { suite: rectangle, image: 'deconvbench-images:rectangle-2.5', var: IMG_RECTANGLE }
          - { suite: secret,    image: 'deconvbench-images-secret:2.4',    var: IMG_SECRET }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - name: Install Nextflow
        run: curl -fsSL https://get.nextflow.io | bash && sudo mv nextflow /usr/local/bin/
      - name: Install Apptainer
        run: |
          curl -fsSLO https://github.com/apptainer/apptainer/releases/download/v1.3.6/apptainer_1.3.6_amd64.deb
          sudo apt-get install -y ./apptainer_1.3.6_amd64.deb
          # Ubuntu 24.04 restricts the user namespaces that apptainer uses without root
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Pull the image
        # private packages: the repository needs read access to them (package settings, "Manage Actions access")
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login --username "${{ github.actor }}" --password-stdin oras://ghcr.io
          apptainer pull "$RUNNER_TEMP/image.sif" "$REGISTRY/${{ matrix.image }}"
      - name: Main workflow with the methods of the image
        run: |
          export ${{ matrix.var }}=$RUNNER_TEMP/image.sif
          export CI_BIND=$GITHUB_WORKSPACE,$RUNNER_TEMP
          pipeline/tests/ci/run_ci.sh ${{ matrix.suite }} "$RUNNER_TEMP/ci"
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite }}-logs
          path: ${{ runner.temp }}/ci/*/nextflow.log
          retention-days: 7
